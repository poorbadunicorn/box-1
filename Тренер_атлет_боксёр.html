:root{--ink:#1a1a1a;--far:#9b9b9b;--red:#b3261e;--blue:#1f5fa8;--teal:#2a8c8c;--rule:#d9d9d9;--muted:#666}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:"PT Serif",Georgia,serif;-webkit-tap-highlight-color:transparent}
body{font-size:16px;line-height:1.45;padding-bottom:calc(64px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;background:#fff;z-index:5;border-bottom:1.4px solid var(--ink);padding:10px 16px 8px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;flex:1;line-height:1.2}
header.top button.back{font:inherit;font-size:22px;border:0;background:none;padding:0 6px 0 0;cursor:pointer;color:var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1.4px solid var(--ink);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;font:inherit;font-size:14px;background:none;border:0;padding:10px 4px 12px;cursor:pointer;color:var(--muted)}
nav.tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--red)}
h2{font-size:17px;margin:22px 0 4px;font-style:italic}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:.8px solid var(--rule);padding:11px 2px;display:flex;align-items:center;gap:12px;cursor:pointer}
.list li .ic{flex:0 0 54px;height:46px}
.list li .ic svg{width:54px;height:46px}
.list li .tx{flex:1;min-width:0}
.list li .nm{font-weight:700}
.list li .ds{font-size:14px;color:var(--muted)}
.list li .ck{flex:0 0 26px;height:26px;border:1.4px solid var(--ink);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px}
.list li.done .ck{background:var(--ink);color:#fff}
.list li.done .nm{text-decoration:line-through;text-decoration-color:#999}
.stage{border-bottom:.8px solid var(--rule);margin:0 -16px;background:#fff;position:relative}
.stage svg{display:block;width:100%;height:auto;max-height:52vh}
.cap{text-align:center;font-style:italic;min-height:1.5em;margin:6px 0 2px;color:var(--red)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 4px}
button.b{font:inherit;font-size:15px;border:1.2px solid var(--ink);background:#fff;color:var(--ink);padding:7px 14px;border-radius:3px;cursor:pointer}
button.b.on,button.b.pri{background:var(--ink);color:#fff}
button.b.red{border-color:var(--red);background:var(--red);color:#fff}
button.b:disabled{opacity:.35}
.dose{border-top:1.4px solid var(--ink);border-bottom:1.4px solid var(--ink);margin:12px 0;padding:8px 2px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.dose .big{font-size:22px;font-weight:700}
.sets{display:flex;gap:6px;margin-top:4px}
.sets span{width:22px;height:22px;border:1.2px solid var(--ink);border-radius:50%;display:inline-block}
.sets span.f{background:var(--ink)}
ol.how{padding-left:1.4em;margin:4px 0 10px}ol.how li{margin:3px 0}
ul.err{padding-left:1.2em;margin:4px 0 10px}ul.err li{margin:3px 0}
.timerbox{text-align:center;padding:14px 0}
.digits{font-size:72px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
.phase{font-size:20px;margin:6px 0 2px;font-weight:700}
.phase.work{color:var(--red)}.phase.rest{color:var(--teal)}
.overlay{position:fixed;inset:0;background:rgba(255,255,255,.97);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.overlay .digits{font-size:96px}
.row{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin:8px 0}
.row label{font-size:15px}
input[type=number],select{font:inherit;font-size:16px;padding:5px 6px;border:1.2px solid var(--ink);border-radius:3px;background:#fff;width:5em}
select{width:auto}
.weeks{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0}
.weeks button{font:inherit;width:38px;height:38px;border:1.2px solid var(--ink);background:#fff;border-radius:3px;cursor:pointer}
.weeks button.on{background:var(--ink);color:#fff}
.weeks button.dl{border-style:dashed}
.days{display:flex;gap:4px;margin:8px 0 2px;flex-wrap:wrap}
.days button{font:inherit;font-size:14px;flex:1;min-width:44px;padding:7px 2px;border:1.2px solid var(--ink);background:#fff;border-radius:3px;cursor:pointer}
.days button.on{background:var(--ink);color:#fff}
.note{font-size:14px;color:var(--muted);margin:6px 0}
.note.warn{color:var(--red)}
table.t{border-collapse:collapse;width:100%;font-size:14px;border-top:1.4px solid var(--ink);border-bottom:1.4px solid var(--ink);margin:8px 0}
table.t th,table.t td{padding:4px 6px;text-align:center}
table.t thead tr{border-bottom:.8px solid var(--ink)}
table.t td.cur{font-weight:700;background:#f3f3f3}
.lead{font-size:15px;margin:10px 0}
.small{font-size:13px;color:var(--muted)}

 const id=Math.random();anim={id,playing,raf:requestAnimationFrame(loop)};}
function stopAnim(){if(anim){cancelAnimationFrame(anim.raf);anim=null;}}
function thumb(e){if(!e)return `<svg viewBox="0 0 60 50"><circle cx="30" cy="25" r="12" fill="#c9e0a0" stroke="${INK}"/><circle cx="30" cy="25" r="3" fill="${INK}"/></svg>`;const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox',e.vb);const fr=e.frames[e.frames.length>2?Math.floor(e.frames.length/2):e.frames.length-1];let tm=0;for(const f of e.frames){tm+=f.t;if(f===fr)break;tm+=f.h;}renderEx(e,s,tm);return s.outerHTML;}

/* ============ Звук и таймеры ============ */
let actx=null;function beep(f,d,n){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();n=n||1;for(let i=0;i<n;i++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+i*(d+.08);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.start(t);o.stop(t+d+.02);}}catch(e){}if(navigator.vibrate)navigator.vibrate(n>1?[200,100,200]:150);}
const fmt=s=>{s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
let tmr=null;
function runTimer(plan,onUpd,onEnd){ // plan: [{label,sec,kind}]
 if(tmr)clearInterval(tmr.iv);let i=0,left=plan[0].sec,last=Date.now(),paused=false;beep(880,.25,1);
 const tick=()=>{const now=Date.now();if(!paused)left-=(now-last)/1000;last=now;
  if(left<=3.05&&left>0&&Math.ceil(left)!==tmr.lastWarn){tmr.lastWarn=Math.ceil(left);beep(660,.08,1);}
  if(left<=0){i++;if(i>=plan.length){clearInterval(tmr.iv);tmr=null;beep(990,.35,3);onEnd&&onEnd();return;}left=plan[i].sec;beep(plan[i].kind==='work'?880:520,.3,plan[i].kind==='work'?1:2);}
  onUpd(plan[i],left,i);};
 tmr={iv:setInterval(tick,200),pause(){paused=!paused;return paused;},stop(){clearInterval(this.iv);tmr=null;},lastWarn:0};tick();}
function overlay(plan,title){const o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="small">${title||''}</div><div class="phase" id="ovp"></div><div class="digits" id="ovd"></div><div class="small" id="ovn"></div><div class="row"><button class="b" id="ovpause">Пауза</button><button class="b pri" id="ovstop">Закрыть</button></div>`;document.body.appendChild(o);
 const close=()=>{if(tmr)tmr.stop();o.remove();};o.querySelector('#ovstop').onclick=close;o.querySelector('#ovpause').onclick=e=>{if(tmr)e.target.textContent=tmr.pause()?'Дальше':'Пауза';};
 runTimer(plan,(ph,left,i)=>{const p=o.querySelector('#ovp');p.textContent=ph.label;p.className='phase '+ph.kind;o.querySelector('#ovd').textContent=fmt(left);o.querySelector('#ovn').textContent=`${i+1} / ${plan.length}`;},()=>{o.querySelector('#ovp').textContent='Готово!';o.querySelector('#ovp').className='phase';o.querySelector('#ovd').textContent='0:00';});}
function roundsPlan(n,work,rest,lab){const p=[{label:'Приготовиться',sec:5,kind:'rest'}];for(let i=0;i<n;i++){p.push({label:(lab||'Раунд')+' '+(i+1),sec:work,kind:'work'});if(i<n-1&&rest>0)p.push({label:'Отдых',sec:rest,kind:'rest'});}return p;}

/* ============ Экраны ============ */
let stack=[];
function setTitle(t,back){$('#title').textContent=t;$('#back').style.display=back?'':'none';}
$('#back').onclick=()=>{stack.pop();const f=stack.pop();f?f():show(state.tab);};
function nav(fn){stack.push(fn);fn();window.scrollTo(0,0);}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{stack=[];show(b.dataset.t);});
function show(t){state.tab=t;stopAnim();document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 ({day:viewDay,lib:viewLib,timer:viewTimer,log:viewLog})[t]();window.scrollTo(0,0);}

function doneKey(w,d){return 'done_'+w+'_'+d;}
function viewDay(){stopAnim();setTitle('Тренировка дня',false);const w=state.week,d=state.day,day=DAYS[d];const done=LS.get(doneKey(w,d),{});
 let h=`<div class="lead">Неделя программы:</div><div class="weeks">${[1,2,3,4,5,6,7,8].map(i=>`<button class="${i===w?'on':''} ${i===4||i===8?'dl':''}" data-w="${i}">${i}</button>`).join('')}</div>`;
 h+=`<div class="days">${DAYKEYS.map((k,i)=>`<button data-d="${k}" class="${k===d?'on':''}">${DAYSH[i]}</button>`).join('')}</div>`;
 h+=`<h2>${day.full}</h2>`;
 if(w<=3)h+=`<div class="note">Фаза «База»: учим технику, усилие умеренное.</div>`;else if(w>=5&&w<=7)h+=`<div class="note">Фаза «Развитие»: больше взрывной работы, веса тяжелее.</div>`;
 if(w===4||w===8)h+=`<div class="note warn">Разгрузочная неделя: делай <b>половину</b> подходов и раундов от указанного, усилие не выше 6.${TESTS[d]?' Сегодня тесты — см. внизу.':''}</div>`;
 h+=`<ul class="list">`;day.items.forEach((it,i)=>{const e=EX[it.ex];const ds=doseFor(it,w);h+=`<li data-i="${i}" class="${done[i]?'done':''}"><div class="ic">${thumb(e)}</div><div class="tx"><div class="nm">${it.name||(e?e.name:'')}</div><div class="ds">${ds.txt}${ds.deload?' · ÷2':''}</div></div><div class="ck" data-ck="${i}">${done[i]?'✓':''}</div></li>`;});h+=`</ul>`;
 if((w===4||w===8)&&TESTS[d]){h+=`<h2>Тесты недели ${w}</h2><table class="t"><thead><tr><th style="text-align:left">Тест</th><th>Нед. 4</th><th>Нед. 8</th></tr></thead><tbody>`;TESTS[d].forEach((t,i)=>{const k='test_'+d+'_'+i;const v=LS.get(k,{});h+=`<tr><td style="text-align:left">${t}</td><td><input type="number" data-tk="${k}" data-tw="4" value="${v[4]||''}" ${w!==4?'disabled':''}></td><td><input type="number" data-tk="${k}" data-tw="8" value="${v[8]||''}" ${w!==8?'disabled':''}></td></tr>`;});h+=`</tbody></table>`;}
 h+=`<div class="row" style="margin-top:16px"><button class="b pri" id="logday">Записать тренировку в дневник</button></div><p class="small">Нажми на упражнение, чтобы увидеть, как его делать. Кружок справа — отметка «сделано».</p>`;
 main.innerHTML=h;
 main.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{state.week=+b.dataset.w;LS.set('week',state.week);viewDay();});
 main.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{state.day=b.dataset.d;LS.set('day',state.day);viewDay();});
 main.querySelectorAll('li[data-i]').forEach(li=>li.onclick=ev=>{const i=+li.dataset.i;if(ev.target.closest('[data-ck]')){const dn=LS.get(doneKey(w,d),{});dn[i]=!dn[i];LS.set(doneKey(w,d),dn);viewDay();return;}nav(()=>viewItem(d,i));});
 main.querySelectorAll('[data-tk]').forEach(inp=>inp.onchange=()=>{const v=LS.get(inp.dataset.tk,{});v[inp.dataset.tw]=inp.value;LS.set(inp.dataset.tk,v);});
 $('#logday').onclick=()=>nav(()=>viewLogForm(w,d));}

function exHTML(e){return `<div class="stage"><svg id="stage" viewBox="${e.vb}"></svg></div><div class="cap" id="cap"></div>
 <div class="ctrl"><button class="b" id="pp">❚❚ Пауза</button>${[.5,1,1.5].map(s=>`<button class="b sp ${s===state.speed?'on':''}" data-s="${s}">${s}×</button>`).join('')}${e.view==='top'?`<button class="b ${state.lefty?'on':''}" id="lefty">Левша</button>`:''}</div>`;}
function exText(e){let h='';if(e.how&&e.how.length)h+=`<h2>Как делать</h2><ol class="how">${e.how.map(x=>`<li>${x}</li>`).join('')}</ol>`;if(e.err&&e.err.length)h+=`<h2>Частые ошибки</h2><ul class="err">${e.err.map(x=>`<li>${x}</li>`).join('')}</ul>`;return h;}
function bindEx(e){const svg=$('#stage');startAnim(e,svg,$('#cap'));$('#pp').onclick=ev=>{anim.playing=!anim.playing;ev.target.textContent=anim.playing?'❚❚ Пауза':'▶ Играть';};
 main.querySelectorAll('.sp').forEach(b=>b.onclick=()=>{state.speed=+b.dataset.s;main.querySelectorAll('.sp').forEach(x=>x.classList.toggle('on',x===b));});
 const lf=$('#lefty');if(lf)lf.onclick=()=>{state.lefty=!state.lefty;LS.set('lefty',state.lefty);lf.classList.toggle('on',state.lefty);};}

function viewItem(d,i){stopAnim();const day=DAYS[d],it=day.items[i],e=EX[it.ex],w=state.week,ds=doseFor(it,w);setTitle(it.name||(e?e.name:''),true);
 const pd=parseDose(ds.txt);let n=pd?pd.n:0;if(ds.deload&&n)n=Math.max(1,Math.ceil(n/2));
 const isRounds=it.rounds&&pd&&(pd.u==='мин'||pd.u==='с');const isHold=e&&e.hold&&pd&&pd.u==='с';
 const key='sets_'+w+'_'+d+'_'+i;let doneSets=LS.get(key,0);
 let h=e?exHTML(e):`<div class="lead" style="margin-top:16px">${it.note||''}</div>`;
 h+=`<div class="dose"><div><div class="small">Неделя ${w}${ds.deload?' · разгрузка: половина':''}</div><div class="big">${ds.txt}</div>${n&&!isRounds?`<div class="sets" id="sets">${Array.from({length:n},(_,k)=>`<span class="${k<doneSets?'f':''}"></span>`).join('')}</div>`:''}</div><div>`;
 if(isRounds){const work=pd.u==='мин'?pd.v*60:pd.v;h+=`<button class="b red" id="go">▶ ${n} × ${fmt(work)}</button>`;}
 else if(isHold){h+=`<button class="b red" id="go">▶ Держать ${pd.v} с</button>`;}
 else if(n){h+=`<button class="b pri" id="setdone">Подход сделан</button>`;}
 h+=`</div></div>`;
 if(it.note&&e)h+=`<p class="lead"><i>${it.note}</i></p>`;
 if(it.rest&&!isRounds)h+=`<div class="small">Отдых между подходами: ${fmt(it.rest)}</div>`;
 if(e)h+=exText(e)+weekTable(it);
 const prev=i>0,next=i<day.items.length-1;h+=`<div class="row" style="margin:18px 0"><button class="b" id="prev" ${prev?'':'disabled'}>‹ Назад</button><button class="b pri" id="next">${next?'Следующее ›':'Готово ✓'}</button></div>`;
 main.innerHTML=h;if(e)bindEx(e);
 const markDone=()=>{const dn=LS.get(doneKey(w,d),{});dn[i]=true;LS.set(doneKey(w,d),dn);};
 const go=$('#go');if(go)go.onclick=()=>{if(isRounds){const work=pd.u==='мин'?pd.v*60:pd.v;overlay(roundsPlan(n,work,it.rest||0,pd.u==='мин'?'Раунд':'Отрезок'),it.name||e.name);}else overlay(roundsPlan(n,pd.v,it.rest||45,'Подход'),e.name);markDone();};
 const sd=$('#setdone');if(sd)sd.onclick=()=>{doneSets=Math.min(n,doneSets+1);LS.set(key,doneSets);main.querySelectorAll('#sets span').forEach((s,k)=>s.classList.toggle('f',k<doneSets));if(doneSets>=n){markDone();beep(990,.3,2);}else if(it.rest)overlay([{label:'Отдых',sec:it.rest,kind:'rest'}],'Подход '+doneSets+' из '+n+' сделан');};
 $('#prev').onclick=()=>{stack.pop();nav(()=>viewItem(d,i-1));};
 $('#next').onclick=()=>{if(!e||!n)markDone();if(next){stack.pop();nav(()=>viewItem(d,i+1));}else{stack=[];show('day');}};}
function weekTable(it){return `<h2>Прогрессия по неделям</h2><table class="t"><thead><tr>${WK.map(k=>`<th>${k}</th>`).join('')}</tr></thead><tbody><tr>${it.dose.map((s,k)=>`<td class="${WK[k]===state.week?'cur':''}">${s}</td>`).join('')}</tr></tbody></table><div class="small">Недели 4 и 8 — разгрузка: половина от недель 3 и 7.</div>`;}

function viewLib(){stopAnim();setTitle('Упражнения',false);const cats=[];Object.values(EX).forEach(e=>{if(!cats.includes(e.cat))cats.push(e.cat);});
 let h='';cats.forEach(c=>{h+=`<h2>${c}</h2><ul class="list">`;Object.values(EX).filter(e=>e.cat===c).forEach(e=>{h+=`<li data-id="${e.id}"><div class="ic">${thumb(e)}</div><div class="tx"><div class="nm">${e.name}</div><div class="ds">${(e.how&&e.how[0])||''}</div></div></li>`;});h+=`</ul>`;});
 main.innerHTML=h;main.querySelectorAll('li[data-id]').forEach(li=>li.onclick=()=>nav(()=>viewLibEx(li.dataset.id)));}
function viewLibEx(id){stopAnim();const e=EX[id];setTitle(e.name,true);main.innerHTML=exHTML(e)+exText(e)+'<div style="height:20px"></div>';bindEx(e);}

function viewTimer(){stopAnim();setTitle('Таймер',false);const c=LS.get('tcfg',{n:3,w:180,r:60});
 main.innerHTML=`<h2>Боксёрские раунды</h2><div class="row"><label>Раундов <input type="number" id="tn" value="${c.n}" min="1"></label><label>Работа, с <input type="number" id="tw" value="${c.w}" step="15"></label><label>Отдых, с <input type="number" id="tr" value="${c.r}" step="15"></label></div>
 <div class="row">${[[3,120,60,'3 × 2 мин'],[3,180,60,'3 × 3 мин'],[5,180,60,'5 × 3 мин'],[8,30,30,'8 × 30/30']].map(p=>`<button class="b pre" data-p="${p.slice(0,3)}">${p[3]}</button>`).join('')}</div>
 <div class="row"><button class="b red" id="tgo">▶ Старт</button></div>
 <h2>Отдых между подходами</h2><div class="row">${[30,45,60,90,120].map(s=>`<button class="b rs" data-s="${s}">${fmt(s)}</button>`).join('')}</div>
 <p class="small">Сигнал в начале и конце каждого раунда, три коротких сигнала за 3 секунды до смены. Звук включается после первого нажатия; на телефоне выключи беззвучный режим.</p>`;
 main.querySelectorAll('.pre').forEach(b=>b.onclick=()=>{const [n,w,r]=b.dataset.p.split(',');$('#tn').value=n;$('#tw').value=w;$('#tr').value=r;});
 $('#tgo').onclick=()=>{const n=+$('#tn').value||1,w=+$('#tw').value||60,r=+$('#tr').value||0;LS.set('tcfg',{n,w,r});overlay(roundsPlan(n,w,r),'Раунды');};
 main.querySelectorAll('.rs').forEach(b=>b.onclick=()=>overlay([{label:'Отдых',sec:+b.dataset.s,kind:'rest'}],'Отдых'));}

function viewLogForm(w,d){stopAnim();setTitle('Запись: '+DAYS[d].name,true);const k='log_'+w+'_'+d;const v=LS.get(k,{t:'',r:''});
 main.innerHTML=`<h2>Неделя ${w}, ${DAYS[d].full}</h2><div class="row"><label>Длительность, мин <input type="number" id="lt" value="${v.t}"></label><label>Усилие RPE (1–10) <input type="number" id="lr" min="1" max="10" value="${v.r}"></label></div>
 <div class="row"><label>Заметки</label></div><textarea id="ln" style="width:100%;min-height:80px;font:inherit;padding:6px;border:1.2px solid #1a1a1a;border-radius:3px">${v.n||''}</textarea>
 <div class="lead" id="lcalc"></div><div class="row"><button class="b pri" id="lsave">Сохранить</button></div>
 <p class="small">Нагрузка тренировки L = RPE × минуты. 1–2 очень легко, 5–6 говоришь фразами, 7–8 тяжело (в силовых: 2–3 повтора в запасе), 10 — предел.</p>`;
 const calc=()=>{const t=+$('#lt').value,r=+$('#lr').value;$('#lcalc').textContent=t&&r?`Нагрузка L = ${r} × ${t} = ${r*t}`:'';};$('#lt').oninput=calc;$('#lr').oninput=calc;calc();
 $('#lsave').onclick=()=>{LS.set(k,{t:+$('#lt').value,r:+$('#lr').value,n:$('#ln').value});stack=[];show('log');};}
function weekLoad(w){let s=0;DAYKEYS.forEach(d=>{const v=LS.get('log_'+w+'_'+d,null);if(v&&v.t&&v.r)s+=v.t*v.r;});return s;}
function viewLog(){stopAnim();setTitle('Дневник',false);const plan=[1500,1650,1800,1050,1900,2050,2200,1150];
 let h=`<h2>Недельная нагрузка</h2><table class="t"><thead><tr><th>Неделя</th><th>План</th><th>Факт</th><th>Рост</th></tr></thead><tbody>`;
 for(let w=1;w<=8;w++){const f=weekLoad(w),p=w>1?weekLoad(w-1):0;const g=f&&p?Math.round((f/p-1)*100):null;h+=`<tr><td>${w}${w===4||w===8?' (тест)':''}</td><td>${plan[w-1]}</td><td>${f||'—'}</td><td style="${g>10?'color:#b3261e;font-weight:700':''}">${g===null?'':(g>0?'+':'')+g+'%'}</td></tr>`;}
 h+=`</tbody></table><p class="small">Правило: недельная нагрузка растёт не больше чем на 10% (красным — превышение). Сбавь, если утренний пульс на 7+ ударов выше обычного или плохо спал две ночи подряд.</p><h2>Записи недели ${state.week}</h2><ul class="list">`;
 DAYKEYS.forEach((d,i)=>{const v=LS.get('log_'+state.week+'_'+d,null);h+=`<li data-d="${d}"><div class="tx"><div class="nm">${DAYSH[i]} · ${DAYS[d].name}</div><div class="ds">${v&&v.t?`${v.t} мин × RPE ${v.r} = ${v.t*v.r}`:'нет записи'}${v&&v.n?' · '+v.n:''}</div></div></li>`;});
 h+=`</ul><h2>Тесты</h2><table class="t"><thead><tr><th style="text-align:left">Тест</th><th>Нед. 4</th><th>Нед. 8</th></tr></thead><tbody>`;
 Object.keys(TESTS).forEach(d=>TESTS[d].forEach((t,i)=>{const v=LS.get('test_'+d+'_'+i,{});h+=`<tr><td style="text-align:left">${t}</td><td>${v[4]||'—'}</td><td>${v[8]||'—'}</td></tr>`;}));
 h+=`</tbody></table><div class="row" style="margin:20px 0"><button class="b" id="reset">Стереть все записи</button></div>`;
 main.innerHTML=h;main.querySelectorAll('li[data-d]').forEach(li=>li.onclick=()=>nav(()=>viewLogForm(state.week,li.dataset.d)));
 $('#reset').onclick=()=>{if(confirm('Стереть дневник, отметки и тесты?')){Object.keys(localStorage).filter(k=>k.startsWith('ab_')).forEach(k=>localStorage.removeItem(k));show('log');}};}

show('day');
</script></body></html>
